name: Test the first-use connection guide
on:
  workflow_dispatch:
  push:
    branches: [test/first-use-next-step]
permissions:
  contents: read
concurrency:
  group: first-use-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Qt and OpenSSL SDKs
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 -O "$env:RUNNER_TEMP/qt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $openssl = Join-Path $env:ProgramFiles 'OpenSSL'
          if (!(Test-Path "$openssl/include/openssl/ssl.h")) { throw 'The hosted runner is missing the full OpenSSL SDK.' }
          "QT_SDK=$env:RUNNER_TEMP/qt/6.10.3/msvc2022_64" >> $env:GITHUB_ENV
          "OPENSSL_SDK=$openssl" >> $env:GITHUB_ENV
      - name: Build and run Windows tests
        shell: pwsh
        run: ./deploy/enhanced/windows.ps1 build
      - name: Create and exercise the Windows installer
        shell: pwsh
        run: ./deploy/enhanced/windows.ps1 package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: first-use-windows-package
          path: release-out/*
          if-no-files-found: error
      - name: Check both first-use roles in the replacement package
        shell: powershell
        run: '& ([scriptblock]::Create((Get-Content ./deploy/enhanced/check-first-identity.ps1 -Raw -Encoding UTF8))) -Installer (Get-ChildItem release-out/*Setup.exe).FullName'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: first-use-windows-current
          path: first-use-evidence/*.png
          if-no-files-found: error
  baseline:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Capture first-use behavior in the published package
        shell: powershell
        run: '& ([scriptblock]::Create((Get-Content ./deploy/enhanced/check-first-identity.ps1 -Raw -Encoding UTF8))) -Baseline'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: first-use-windows-baseline
          path: first-use-evidence/*.png
          if-no-files-found: error
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Qt and locate OpenSSL
        run: |
          python3 -m venv "$RUNNER_TEMP/qt-tools"
          "$RUNNER_TEMP/qt-tools/bin/pip" install aqtinstall==3.3.0
          "$RUNNER_TEMP/qt-tools/bin/aqt" install-qt mac desktop 6.10.3 clang_64 -O "$RUNNER_TEMP/qt"
          echo "QT_SDK=$RUNNER_TEMP/qt/6.10.3/macos" >> "$GITHUB_ENV"
          echo "OPENSSL_SDK=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Build, test and exercise the macOS disk image
        env:
          # The retry branch corrects the package's smoke environment after the
          # standard-profile test suite passed for the same application source.
          DESKFLOW_SKIP_SOURCE_TESTS: ${{ github.ref_name == 'release/macos-preview' && '1' || '0' }}
        run: bash deploy/enhanced/macos.sh "$PWD/build" "$QT_SDK" "$OPENSSL_SDK"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-arm64-package
          path: build/release-out/*
          if-no-files-found: error
